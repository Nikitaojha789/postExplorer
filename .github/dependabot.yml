# Weekly, grouped updates. React Native core packages move together and are
# upgraded deliberately with the RN Upgrade Helper, so they are excluded here.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-community/cli*'
    groups:
      react-navigation:
        patterns: ['@react-navigation/*', 'react-native-screens', 'react-native-safe-area-context']
      software-mansion:
        patterns:
          ['react-native-reanimated', 'react-native-worklets', 'react-native-gesture-handler']
      tanstack:
        patterns: ['@tanstack/*']
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'globals']
      testing:
        patterns: ['jest', '@types/jest', '@testing-library/*', 'test-renderer', 'reassure']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly

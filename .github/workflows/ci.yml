name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run test:coverage -- --ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  performance:
    name: Render performance (Reassure)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Baseline (base branch)
        run: |
          git switch ${{ github.base_ref }}
          npm ci
          npm run test:perf:baseline
      - name: Current (PR branch)
        run: |
          git switch ${{ github.head_ref }}
          npm ci
          npm run test:perf
      - uses: actions/upload-artifact@v4
        with:
          name: reassure-report
          path: .reassure/output.md

  android:
    name: Android build (devDebug)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Assemble
        working-directory: android
        run: ./gradlew assembleDevDebug -PreactNativeArchitectures=x86_64 --no-daemon

  ios:
    name: iOS build (Debug-Dev, simulator)
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    env:
      USE_CCACHE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ios-${{ runner.os }}
      - uses: actions/cache@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
      - run: npm ci
      - run: npm run pods
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace Baseline.xcworkspace -scheme Baseline-Dev -configuration Debug-Dev \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO

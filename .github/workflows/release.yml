name: Release

# Manual, auditable releases. Build number = workflow run number (monotonic),
# version name/marketing version = package.json "version".
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [qa, staging, prod]
      platform:
        description: Platform
        type: choice
        options: [android, ios, both]

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      REQUIRE_RELEASE_SIGNING: 'true'
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: npm ci
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/release.jks
      - name: Build & upload to Play internal track
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: bundle exec fastlane android release env:${{ inputs.environment }}

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    timeout-minutes: 90
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      USE_CCACHE: '1'
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: hendrikmuhs/ccache-action@v1
        with:
          key: ios-release-${{ runner.os }}
      - run: npm ci
      - run: npm run pods
      - name: Build & upload to TestFlight
        run: bundle exec fastlane ios release env:${{ inputs.environment }}

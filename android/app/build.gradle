apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Sentry: uploads JS source maps + Hermes maps on release builds. Applied only
// when credentials exist so the template builds without a Sentry account.
if (System.getenv("SENTRY_AUTH_TOKEN")) {
    apply from: "../../node_modules/@sentry/react-native/sentry.gradle"
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    debuggableVariants = ["dev", "qa", "staging", "prod"].collectMany { [it + "Debug", it + "DebugOptimized"] }

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ── Environments ──────────────────────────────────────────────────────────
// Each product flavor maps to a committed, PUBLIC `.env.<environment>` file at
// the repo root. react-native-config exposes the same file to JS
// (see `project.ext.envConfigFiles` below).
def ENVIRONMENTS = [
    dev    : "development",
    qa     : "qa",
    staging: "staging",
    prod   : "production",
]

def readEnvFile = { String name ->
    def env = [:]
    def file = rootProject.file("../.env.${name}")
    if (!file.exists()) throw new GradleException("Missing ${file}")
    file.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed && !trimmed.startsWith("#") && trimmed.contains("=")) {
            def (key, value) = trimmed.split("=", 2)
            env[key.trim()] = value.trim()
        }
    }
    return env
}

project.ext.envConfigFiles = ENVIRONMENTS.collectEntries { flavor, envName ->
    [(flavor + "debug"): ".env.${envName}", (flavor + "release"): ".env.${envName}", (flavor + "debugoptimized"): ".env.${envName}"]
}
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// ── Versioning ────────────────────────────────────────────────────────────
// versionName: package.json "version" (single source of truth, semver).
// versionCode: CI build number (monotonic), 1 for local builds.
def packageJson = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
def appVersionName = packageJson.version
def appVersionCode = (System.getenv("BUILD_NUMBER") ?: "1").toInteger()

// ── Release signing ───────────────────────────────────────────────────────
// CI passes ANDROID_KEYSTORE_* env vars; locally use android/keystore.properties
// (git-ignored). Without either, release builds fall back to the debug key so
// they still install locally — CI must set REQUIRE_RELEASE_SIGNING=true.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String envKey, String propKey -> System.getenv(envKey) ?: keystoreProps.getProperty(propKey) }
def releaseStoreFile = signingValue("ANDROID_KEYSTORE_FILE", "storeFile")
def hasReleaseSigning = releaseStoreFile != null
if (!hasReleaseSigning && System.getenv("REQUIRE_RELEASE_SIGNING") == "true") {
    throw new GradleException("Release signing is required but no keystore was provided.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.company.baseline"
    defaultConfig {
        applicationId "com.company.baseline"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        // react-native-config reads BuildConfig from this package even when
        // applicationIdSuffix changes the runtime package name.
        resValue "string", "build_config_package", "com.company.baseline"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions = ["environment"]
    productFlavors {
        ENVIRONMENTS.each { flavor, envName ->
            def env = readEnvFile(envName)
            create(flavor) {
                dimension "environment"
                if (env.APP_ID_SUFFIX) applicationIdSuffix env.APP_ID_SUFFIX
                resValue "string", "app_name", env.APP_DISPLAY_NAME ?: "Baseline"
                manifestPlaceholders = [
                    deepLinkScheme: env.DEEP_LINK_SCHEME,
                    deepLinkHost  : env.DEEP_LINK_HOST ?: "localhost",
                ]
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword signingValue("ANDROID_KEYSTORE_PASSWORD", "storePassword")
                keyAlias signingValue("ANDROID_KEY_ALIAS", "keyAlias")
                keyPassword signingValue("ANDROID_KEY_PASSWORD", "keyPassword")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

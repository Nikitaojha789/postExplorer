# Project-wide Gradle settings. https://docs.gradle.org/current/userguide/build_environment.html

# Daemon heap: RN + Hermes + R8 need headroom; too little = slow GC-bound builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Supported by the RN Gradle plugin since 0.79 (https://reactnative.dev/docs/build-speed).
# `warn`: some third-party libraries (netinfo, keyboard-controller, keychain as of
# Oct 2026) still spawn `node` at configuration time, which strict mode rejects.
# Switch back to strict once `./gradlew assembleDevDebug` reports no problems.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true

# ABIs to build. Local `run-android` builds only the connected device's ABI
# (--active-arch-only); release AABs include all and Play serves per-device splits.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture is mandatory since RN 0.82; Hermes V1 is the default engine since 0.84.
newArchEnabled=true
hermesEnabled=true

# Android 15+ enforces edge-to-edge; this opts in consistently on older versions too.
edgeToEdgeEnabled=true

# AGP 9 opt-outs kept until all third-party libraries migrate (RN 0.87 template defaults).
android.builtInKotlin=false
android.newDsl=false

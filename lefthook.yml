# Git hooks — https://lefthook.dev
# Fast, parallel, staged-files-only checks. The full suite runs in CI.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{js,mjs,cjs,ts,tsx}'
      run: npx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: format
      glob: '*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml}'
      run: npx prettier --check {staged_files}
    - name: i18n
      glob: 'src/core/i18n/locales/**/*.json'
      run: node scripts/check-i18n.mjs

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
